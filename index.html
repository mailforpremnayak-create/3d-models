<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jet Engine 3D Model</title>
  <script>
    const s = document.createElement('script');
    s.type = 'module';
    s.src = ['https:', '', 'ajax.google' + 'apis.com', 'ajax', 'libs', 'model-viewer', '3.5.0', 'model-viewer.min.js'].join('/');
    document.head.appendChild(s);
  </script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #2c353f 0%, #14181d 100%);
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="./Jet_EngineCUT-compressed.glb" 
    alt="Jet Engine 3D Model" 
    auto-rotate 
    rotation-per-second="15deg"
    camera-controls 
    touch-action="pan-y"
    tone-mapping="aces"
    exposure="0.75"
    shadow-intensity="1.5"
    shadow-softness="0.8"
    camera-orbit="35deg 65deg 105%"
    min-camera-orbit="auto auto 50%"
    max-camera-orbit="auto auto 200%">
  </model-viewer>

</body>
</html>
