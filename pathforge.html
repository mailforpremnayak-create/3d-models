<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathforge 3D Model</title>
  <script>
    const s = document.createElement('script');
    s.type = 'module';
    s.src = ['https:', '', 'ajax.googleapis.com', 'ajax', 'libs', 'model-viewer', '3.5.0', 'model-viewer.min.js'].join('/');
    document.head.appendChild(s);
  </script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F2F5F3;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="./pathforge.glb" 
    alt="Pathforge 3D Model" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
